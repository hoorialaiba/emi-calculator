apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              for h in mongo-0 mongo-1 mongo-2; do
                until mongosh --host $h.mongo:27017 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
                  echo "waiting for $h"; sleep 3
                done
              done
              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                try { rs.status(); print("already initiated") }
                catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  })
                }'