<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f3f5f4; color: #1d2b27; }
    .brand { background: #12403a; color: #fff; padding: 1.25rem 0; }
    .card { border: 1px solid #d5ddda; border-radius: 6px; }
    .btn-primary { background: #12403a; border-color: #12403a; }
    .btn-primary:hover { background: #0c2d29; border-color: #0c2d29; }
    .emi-figure { font-size: 2.4rem; font-weight: 700; color: #12403a; line-height: 1.1; }
    .table td, .table th { white-space: nowrap; }
  </style>
</head>
<body>
  <header class="brand mb-4">
    <div class="container"><h1 class="h3 mb-0">Loan EMI Calculator</h1></div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card"><div class="card-body">
          <h2 class="h5 mb-3">Loan details</h2>
          <form id="emiForm" novalidate>
            <div class="mb-3">
              <label for="P" class="form-label">Loan amount</label>
              <input type="number" class="form-control" id="P" min="0" step="any" placeholder="500000">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="rate" class="form-label">Annual interest rate (%)</label>
              <input type="number" class="form-control" id="rate" min="0" step="any" placeholder="12">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="n" class="form-label">Tenure (months)</label>
              <input type="number" class="form-control" id="n" min="1" step="1" placeholder="24">
              <div class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="calcBtn">Calculate EMI</button>
            <div class="alert alert-danger mt-3 mb-0 d-none" id="formError"></div>
          </form>
        </div></div>
      </div>

      <div class="col-lg-7">
        <div class="card mb-4"><div class="card-body" id="resultPanel">
          <h2 class="h5 mb-3">Result</h2>
          <p class="text-muted mb-0" id="resultEmpty">Enter loan details and select Calculate EMI.</p>
          <div id="resultBody" class="d-none">
            <div class="text-muted">Monthly instalment</div>
            <div class="emi-figure mb-3" id="rEmi"></div>
            <div class="row mb-3">
              <div class="col-6"><div class="text-muted">Total payment</div><div class="fw-semibold" id="rTotal"></div></div>
              <div class="col-6"><div class="text-muted">Total interest</div><div class="fw-semibold" id="rInterest"></div></div>
            </div>
            <div class="small text-muted">Served by pod <strong id="rPod"></strong> (<span id="rIp"></span>)</div>
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <h2 class="h5 mb-3">Last 10 calculations</h2>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead><tr><th>Time</th><th>Amount</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th></tr></thead>
              <tbody id="historyBody"><tr><td colspan="6" class="text-muted">Loading…</td></tr></tbody>
            </table>
          </div>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
